$kind: http-request
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/files"
method: GET
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Returns 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Returns an array of files\", function () {\r

      \    pm.expect(response).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Contains the created file\", function () {\r

      \    const fileId = pm.collectionVariables.get(\"fileId\");\r

      \r

      \    const file = response.find(file => file.id === fileId);\r

      \r

      \    pm.expect(file).to.exist;\r

      \    pm.expect(file.name).to.eql(\"index.ts\");\r

      });"
    language: text/javascript
order: 8000
