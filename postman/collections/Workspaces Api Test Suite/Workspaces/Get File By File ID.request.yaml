$kind: http-request
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/files/{{fileId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Returns 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Returns the requested file\", function () {\r

      \    pm.expect(response.id).to.eql(\r

      \        pm.collectionVariables.get(\"fileId\")\r

      \    );\r

      \r

      \    pm.expect(response.workspace_id).to.eql(\r

      \        pm.collectionVariables.get(\"workspaceId\")\r

      \    );\r

      });\r

      \r

      pm.test(\"Returns expected file data\", function () {\r

      \    pm.expect(response.name).to.eql(\"index.ts\");\r

      \    pm.expect(response.language).to.eql(\"text\");\r

      \    pm.expect(response.content).to.eql(\"\");\r

      });"
    language: text/javascript
order: 9000
