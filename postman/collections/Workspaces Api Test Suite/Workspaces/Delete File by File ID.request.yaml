$kind: http-request
url: "{{baseUrl}}/api/workspaces/{{workspaceId}}/files/{{otherFileId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: "pm.test(\"Returns 204 No Content\", function () {\r

      \    pm.response.to.have.status(204);\r

      });\r

      \r

      pm.test(\"Returns an empty response body\", function () {\r

      \    pm.expect(pm.response.text()).to.eql(\"\");\r

      });"
    language: text/javascript
order: 11000
